<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Wózek — potwierdzenie rejestracji</title>
<meta name="robots" content="noindex">
<style>
  body { font-family: sans-serif; text-align: center; padding: 3rem 1rem; }
  h1 { font-size: 2rem; }
</style>
</head>
<body>
<h1>ZOSTAŁEŚ DODANY</h1>
<script>
  // Strona na GitHub Pages (nie script.google.com!) — omija problem, że
  // Android potrafi przechwytywać KAŻDĄ nawigację do domeny
  // google.com/script.google.com aplikacją Dysk/Dokumenty, pokazując
  // własny błąd "Nie udało się otworzyć pliku" (nawet po przekierowaniu
  // JS-em, nie tylko po bezpośrednim kliknięciu linku). Napis "ZOSTAŁEŚ
  // DODANY" pokazuje się od razu, statycznie, niezależnie od tego, czy
  // poniższe wywołanie w tle się powiedzie — nie ma tu żadnego stanu
  // pośredniego, który mógłby "zawisnąć" w jakiejś przeglądarce.
  //
  // Samo dopisanie do listy głosicieli (patrz potwierdzRejestracje_() w
  // wozek/src/FormHandler.gs) następuje przez zwykłe wczytanie adresu jako
  // "obrazka" — to tylko żądanie GET, które i tak dociera do serwera i
  // wykonuje kod, niezależnie od tego, czy przeglądarka faktycznie
  // rozpozna odpowiedź jako obrazek.
  var token = new URLSearchParams(window.location.search).get('t');
  if (token) {
    var pinger = new Image();
    pinger.src = 'https://script.google.com/macros/s/AKfycbx0CKI7w4pQQejmhgDfTjTgsOGq-RdJm_4Ul46QIAUoAmnkCRUbNCJ4XrgYij_iNpo/exec?potwierdz=' + encodeURIComponent(token);
  }
</script>
</body>
</html>
